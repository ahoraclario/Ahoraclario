<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahoraclario — Sales CRM</title>
<style>
:root{
  --bg:#0D1117; --bg-raised:#010409; --surface:#161B22; --surface-2:#1C2128;
  --border:#30363D; --border-subtle:#21262D;
  --text:#E6EDF3; --muted:#8B949E; --faint:#6E7681;
  --primary:#3ECF8E; --primary-dark:#2EBE7E; --primary-bg:rgba(62,207,142,.14);
  --blue:#58A6FF; --blue-bg:rgba(88,166,255,.14);
  --green:#3FB950; --green-bg:rgba(63,185,80,.15);
  --amber:#D29922; --amber-bg:rgba(210,153,34,.15);
  --red:#F85149; --red-bg:rgba(248,81,73,.15);
  --purple:#A371F7; --purple-bg:rgba(163,113,247,.15);
  /* eski isimlerle geriye dönük uyum (kod içinde var(--ink) vb. çağrılıyor olabilir) */
  --ink:var(--text); --line:var(--border); --card:var(--surface);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color-scheme:dark}
a{color:var(--blue);text-decoration:none}
.hidden{display:none !important}
::selection{background:var(--primary-bg);color:var(--primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---- Login ---- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg)}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(600px circle at 20% 20%, rgba(62,207,142,.10), transparent 55%),
    radial-gradient(500px circle at 85% 75%, rgba(88,166,255,.08), transparent 55%);
  pointer-events:none;
}
#login-screen::after{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(var(--border-subtle) 1px, transparent 1px),linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
  background-size:42px 42px;opacity:.35;mask-image:radial-gradient(circle at 50% 40%, black, transparent 70%);pointer-events:none;
}
.login-box{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:40px;width:100%;max-width:380px}
.login-logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#22946A);display:flex;align-items:center;justify-content:center;color:#04170F;font-weight:800;font-size:19px;margin-bottom:20px;box-shadow:0 0 0 1px rgba(62,207,142,.3),0 8px 24px rgba(62,207,142,.25)}
.login-box h1{font-size:20px;margin:0 0 4px;color:var(--text);letter-spacing:-.2px}
.login-box p{color:var(--muted);font-size:13px;margin:0 0 26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface-2);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--primary);color:#04170F;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.login-err{color:var(--red);background:var(--red-bg);border:1px solid rgba(248,81,73,.3);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none}

/* ---- App shell ---- */
#app{display:none}
#app.open{display:flex;min-height:100vh}
.sidebar{width:230px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--border-subtle);padding:20px 14px;display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.sb-logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#22946A);color:#04170F;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sb-logo b{font-size:14.5px;color:var(--text);letter-spacing:-.1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--primary-bg);color:var(--primary)}
.sb-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-subtle)}
.sb-user{font-size:12.5px;color:var(--muted);padding:0 8px}
.sb-user b{color:var(--text);display:block;font-size:13.5px}
.sb-logout{font-size:12px;color:var(--red);cursor:pointer;margin-top:6px;display:inline-block}

.main{flex:1;padding:26px 32px;overflow-x:hidden}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:21px;margin:0 0 4px;color:var(--text);letter-spacing:-.2px}
.page-head p{color:var(--muted);font-size:13px;margin:0}

/* ---- Stat cards ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border-subtle);border-radius:10px;padding:16px;transition:border-color .12s,transform .12s;position:relative;overflow:hidden;display:flex;align-items:center;gap:13px}
.stat:hover{border-color:var(--border);transform:translateY(-1px)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stat-color,var(--primary))}
.stat .icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat .n{font-size:21px;font-weight:800;color:var(--stat-color,var(--primary));letter-spacing:-.3px;line-height:1.1}
.stat .l{font-size:11px;color:var(--muted);margin-top:3px}

/* ---- Table ---- */
.tbl-wrap{background:var(--surface);border:1px solid var(--border-subtle);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 14px;background:var(--bg-raised);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border-subtle)}
td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text)}
tr:last-child td{border-bottom:none}
tr.row-click{cursor:pointer;transition:background .1s}
tr.row-click:hover{background:var(--surface-2)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge-source{background:var(--blue-bg);color:var(--blue)}

/* ---- Buttons ---- */
.btn-add{background:var(--primary);color:#04170F;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:700}
.btn-add:hover{background:var(--primary-dark)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 15px;font-size:12.5px;font-weight:700}
.btn-ghost:hover{border-color:var(--faint)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,81,73,.25);border-radius:8px;padding:9px 15px;font-size:12.5px;font-weight:700}

/* ---- Kanban ---- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.col{flex:0 0 240px;display:flex;flex-direction:column}
.col-head{padding:9px 12px;border-radius:9px 9px 0 0;font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.col-body{background:var(--bg-raised);border:1px solid var(--border-subtle);border-top:none;border-radius:0 0 9px 9px;flex:1;min-height:100px;padding:8px;display:flex;flex-direction:column;gap:7px}
.col-body.dragover{background:var(--primary-bg)}
.kcard{background:var(--surface);border:1px solid var(--border-subtle);border-radius:8px;padding:10px 11px;cursor:grab;font-size:12.5px;transition:border-color .12s}
.kcard:hover{border-color:var(--border)}
.kcard:active{cursor:grabbing}
.kcard b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--text)}
.kcard .meta{color:var(--muted);font-size:10.5px;display:flex;justify-content:space-between;margin-top:5px}
.kcard .mrr{color:var(--green);font-weight:700}

/* ---- Panel (slide-over) ---- */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.65);display:none;align-items:center;justify-content:flex-end;z-index:200;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.panel{background:var(--bg);height:100%;width:100%;max-width:560px;overflow-y:auto;padding:26px;border-left:1px solid var(--border-subtle)}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.panel-close{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;font-size:15px;color:var(--muted);cursor:pointer}
.panel-close:hover{color:var(--text)}
.ps{border:1px solid var(--border-subtle);border-radius:10px;margin-bottom:14px;background:var(--surface)}
.ps-head{padding:10px 14px;background:var(--bg-raised);border-bottom:1px solid var(--border-subtle);border-radius:10px 10px 0 0;font-size:12px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.02em}
.ps-head span{text-transform:none;letter-spacing:0;font-weight:600;color:var(--primary)}
.ps-body{padding:14px}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fi{margin-bottom:10px}
.fi label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fi input,.fi select,.fi textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;background:var(--surface-2);color:var(--text)}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:var(--primary)}
.mini-list{display:flex;flex-direction:column;gap:7px}
.mini-item{border:1px solid var(--border-subtle);border-radius:8px;padding:9px 11px;font-size:12px;background:var(--bg-raised);color:var(--text)}
.mini-item b{font-size:12.5px}
.contact-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border-subtle);border-radius:8px;padding:9px 11px;background:var(--bg-raised)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0}
.timeline-item{padding:9px 0;border-bottom:1px solid var(--border-subtle);font-size:12.5px;color:var(--text);position:relative;padding-left:16px}
.timeline-item::before{content:'';position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.timeline-item:last-child{border-bottom:none}
.timeline-item .t{color:var(--muted);font-size:10.5px;margin-top:2px}
.stage-track{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stage-pill{font-size:9.5px;padding:3px 8px;border-radius:12px;cursor:pointer;font-weight:700;border:1px solid transparent;transition:transform .1s}
.stage-pill:hover{transform:translateY(-1px)}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(1,4,9,.65);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{margin:0 0 16px;font-size:16px;color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}

.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:9px;font-size:13px;z-index:400;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{display:block}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">A</div>
    <h1>Ahoraclario</h1>
    <p>Founder Sales CRM'e giriş yapın.</p>
    <div class="login-err" id="loginErr"></div>
    <div class="field"><label>Kullanıcı Adı</label><input id="li-user" type="text"></div>
    <div class="field"><label>Şifre</label><input id="li-pass" type="password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Giriş Yap</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sb-logo"><div class="mark">A</div><b>Ahoraclario</b></div>
    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">📊 Dashboard</button>
    <button class="nav-item" data-page="myday" onclick="showPage('myday')">☀️ My Day</button>
    <button class="nav-item" data-page="pipeline" onclick="showPage('pipeline')">🧭 Pipeline</button>
    <button class="nav-item" data-page="companies" onclick="showPage('companies')">🏢 Şirketler</button>
    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">✅ Görevler</button>
    <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">📈 Raporlar</button>
    <div class="sb-bottom">
      <div class="sb-user"><b id="sbUserName"></b>Founder</div>
      <span class="sb-logout" onclick="doLogout()">Çıkış Yap</span>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- Şirket Detay Paneli -->
<div class="overlay" id="companyOverlay">
  <div class="panel" id="companyPanel"></div>
</div>

<!-- Yeni Şirket Modal -->
<div class="modal-overlay" id="addCompanyModal">
  <div class="modal">
    <h3>+ Yeni Şirket</h3>
    <div class="fi"><label>Şirket Adı *</label><input id="nc-name" type="text"></div>
    <div class="fi-row">
      <div class="fi"><label>Sektör</label><input id="nc-industry" type="text" placeholder="Vize Danışmanlığı"></div>
      <div class="fi"><label>Ülke</label><input id="nc-country" type="text" placeholder="Türkiye"></div>
    </div>
    <div class="fi-row">
      <div class="fi"><label>Website</label><input id="nc-website" type="text"></div>
      <div class="fi"><label>Kaynak</label>
        <select id="nc-source">
          <option value="">—</option>
          <option>LinkedIn</option><option>Cold Email</option><option>Instagram</option>
          <option>Google</option><option>Referral</option><option>Website</option>
          <option>Facebook</option><option>Direct Outreach</option><option>Networking</option>
          <option>AIESEC</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="fi"><label>Öncelik</label>
      <select id="nc-priority">
        <option value="Normal" selected>Normal</option>
        <option value="High">Yüksek 🔥</option>
        <option value="Low">Düşük</option>
      </select>
    </div>
    <div class="fi"><label>Not</label><textarea id="nc-notes" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddCompanyModal()">Vazgeç</button>
      <button class="btn-add" onclick="submitAddCompany()">Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 🔧 DEĞİŞTİRİN: Supabase Edge Function adresiniz
const EDGE_FUNCTION_URL = 'https://tuozgfnjxxwrcuyfrwxq.supabase.co/functions/v1/rapid-service';

const STAGES = ["Prospect","Researched","Contacted","Replied","Discovery Call","Demo","Proposal","Negotiation","Won"];
const STAGE_COLORS = {Prospect:"#8B949E",Researched:"#58A6FF",Contacted:"#79C0FF",Replied:"#A371F7",
  "Discovery Call":"#DB61A2","Demo":"#D29922","Proposal":"#3ECF8E","Negotiation":"#F0883E","Won":"#3FB950"};
const OUTCOME_COLORS = {Lost:"#F85149","No Response":"#6E7681","Not a Fit":"#6E7681"};

let CU = null; // { token, name, username }
let companies = [], opportunities = [], tasks = [];
let currentPage = 'dashboard';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

async function api(action, params={}){
  try{
    const res = await fetch(EDGE_FUNCTION_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, token: CU?.token, ...params })
    });
    const d = await res.json();
    if(!d.success){
      if(d.error?.status === 401){ doLogout(true); }
      toast('Hata: ' + (d.error?.message || 'Bilinmeyen hata'));
    }
    return d;
  }catch(e){ toast('Bağlantı hatası'); return {success:false}; }
}

// ── GİRİŞ ──
async function doLogin(){
  const username = document.getElementById('li-user').value.trim();
  const password = document.getElementById('li-pass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display='none';
  if(!username || !password){ errEl.textContent='Kullanıcı adı ve şifre gerekli'; errEl.style.display='block'; return; }
  const d = await api('login', { username, password });
  if(!d.success){ errEl.textContent = d.error?.message || 'Giriş başarısız'; errEl.style.display='block'; return; }
  CU = { token: d.token, name: d.user.name, username: d.user.username };
  sessionStorage.setItem('ahoraclario_session', JSON.stringify(CU));
  enterApp();
}
function doLogout(silent){
  if(CU && !silent) api('logout');
  CU = null;
  sessionStorage.removeItem('ahoraclario_session');
  document.getElementById('app').classList.remove('open');
  document.getElementById('login-screen').style.display='flex';
}
function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('open');
  document.getElementById('sbUserName').textContent = CU.name;
  showPage('dashboard');
}
(function tryRestoreSession(){
  try{
    const raw = sessionStorage.getItem('ahoraclario_session');
    if(raw){ CU = JSON.parse(raw); enterApp(); }
  }catch(e){}
})();

// ── SAYFA YÖNLENDİRME ──
async function showPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page));
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Yükleniyor...</div>';
  if(page==='dashboard') await renderDashboard();
  else if(page==='myday') await renderMyDay();
  else if(page==='pipeline') await renderPipeline();
  else if(page==='companies') await renderCompanies();
  else if(page==='tasks') await renderTasks();
  else if(page==='analytics') await renderAnalytics();
}

// ══════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════
async function renderDashboard(){
  const d = await api('getDashboard');
  const main = document.getElementById('main');
  if(!d.success){ main.innerHTML='<div class="empty">Yüklenemedi</div>'; return; }

  function statCard(icon, color, value, label){
    return `<div class="stat" style="--stat-color:${color}">
      <div class="icon" style="background:${color}22;color:${color}">${icon}</div>
      <div><div class="n">${value}</div><div class="l">${label}</div></div>
    </div>`;
  }

  main.innerHTML = `
    <div class="page-head">
      <div><h1>Günaydın, ${esc(CU.name)} 👋</h1><p>İşte satış operasyonunun bugünkü özeti.</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost" onclick="showPage('myday')">☀️ My Day'e Git</button>
        <button class="btn-add" onclick="showPage('companies');setTimeout(openAddCompanyModal,80)">+ Yeni Şirket</button>
      </div>
    </div>
    <div class="stats">
      ${statCard('💰','#3ECF8E','₺'+(d.pipelineValue||0).toLocaleString('tr-TR'),'Pipeline Değeri')}
      ${statCard('🏢','#58A6FF',d.totalCompanies||0,'Toplam Şirket')}
      ${statCard('📅','#D29922',d.tasksToday||0,'Bugünkü Follow-up')}
      ${statCard('⏰','#F85149',d.tasksOverdue||0,'Geciken Görev')}
      ${statCard('🎉','#3FB950',d.wonCount||0,'Kazanılan Anlaşma')}
      ${statCard('⭐','#A371F7',d.totalCustomers||0,'Müşteriye Dönüşen')}
    </div>
    <div class="ps">
      <div class="ps-head">Pipeline Dağılımı<span style="cursor:pointer" onclick="showPage('pipeline')">Tümünü Gör →</span></div>
      <div class="ps-body" style="display:flex;flex-wrap:wrap;gap:10px">
        ${STAGES.map(s=>`<div style="flex:1;min-width:100px;text-align:center;padding:12px 10px;border-radius:9px;background:${STAGE_COLORS[s]}18;border:1px solid ${STAGE_COLORS[s]}33">
          <div style="font-size:19px;font-weight:800;color:${STAGE_COLORS[s]}">${(d.stageCounts&&d.stageCounts[s])||0}</div>
          <div style="font-size:10.5px;color:var(--text);margin-top:3px;font-weight:600">${s}</div>
        </div>`).join('')}
      </div>
    </div>`;
}

// ══════════════════════════════════════════════
// MY DAY
// ══════════════════════════════════════════════
async function renderMyDay(){
  const d = await api('getMyDay');
  const main = document.getElementById('main');
  if(!d.success){ main.innerHTML='<div class="empty">Yüklenemedi</div>'; return; }

  function taskRow(t, color){
    return `<div class="mini-item" style="display:flex;justify-content:space-between;align-items:center;border-left:3px solid ${color}">
      <span onclick="openCompanyPanel('${t.company_id}')" style="cursor:pointer"><b>${esc(t.companies?.name||'')}</b> — ${esc(t.title)} ${t.due_date?`<span style="color:var(--muted)">· ${t.due_date}</span>`:''}</span>
      <span style="cursor:pointer;color:var(--green);font-size:11px;flex-shrink:0;margin-left:10px" onclick="completeTaskFromList('${t.id}')">Tamamla</span>
    </div>`;
  }
  function section(title, color, bodyHtml, count){
    return `<div class="ps"><div class="ps-head" style="color:${color}">${title}${count!==undefined?` (${count})`:''}</div><div class="ps-body mini-list">${bodyHtml}</div></div>`;
  }

  const activitySummary = [
    ['email_sent','📧 Email'], ['linkedin_message','💼 LinkedIn'], ['call','📞 Arama'],
    ['reply_received','↩️ Cevap'], ['demo_completed','🖥️ Demo'], ['proposal_sent','📄 Teklif'],
  ].map(([type,label]) => `<span class="badge" style="background:var(--surface-2);border:1px solid var(--border);color:var(--text);margin-right:6px">${label}: <b>${d.activityCounts?.[type]||0}</b></span>`).join('');

  main.innerHTML = `
    <div class="page-head"><div><h1>☀️ My Day</h1><p>Bugün odaklanman gereken her şey burada.</p></div></div>

    ${d.overdueTasks.length ? section('🔴 Geciken Follow-up\'lar', 'var(--red)', d.overdueTasks.map(t=>taskRow(t,'#F85149')).join(''), d.overdueTasks.length) : ''}
    ${section('📩 Bugünkü Follow-up\'lar', 'var(--amber)', d.todayTasks.length?d.todayTasks.map(t=>taskRow(t,'#D29922')).join(''):'<div style="color:var(--muted);font-size:12px">Bugün için görev yok.</div>', d.todayTasks.length)}

    ${d.demosToday.length ? section('🖥️ Bugünkü Demolar', 'var(--purple)', d.demosToday.map(t=>taskRow(t,'#A371F7')).join(''), d.demosToday.length) : ''}

    ${section('🎯 Henüz İletişime Geçilmemiş Adaylar', 'var(--blue)',
      d.notContacted.length?d.notContacted.map(c=>`<div class="mini-item" style="cursor:pointer" onclick="openCompanyPanel('${c.companyId}')"><b>${esc(c.companyName||'—')}</b> <span style="color:var(--muted)">— hiç iletişim kaydı yok</span></div>`).join(''):'<div style="color:var(--muted);font-size:12px">Harika, hepsiyle iletişime geçilmiş!</div>',
      d.notContacted.length)}

    ${section('💰 Cevap Bekleyen Teklifler', 'var(--green)',
      d.openProposals.length?d.openProposals.map(o=>`<div class="mini-item" style="cursor:pointer" onclick="openCompanyPanel('${o.company_id}')"><b>${esc(o.companies?.name||'—')}</b> <span style="color:var(--green);font-weight:700">₺${o.estimated_mrr?Number(o.estimated_mrr).toLocaleString('tr-TR'):'—'}</span></div>`).join(''):'<div style="color:var(--muted);font-size:12px">Bekleyen teklif yok.</div>',
      d.openProposals.length)}

    ${d.upcomingTasks.length ? section('🟢 Yaklaşan (7 gün)', 'var(--green)', d.upcomingTasks.map(t=>taskRow(t,'#3FB950')).join(''), d.upcomingTasks.length) : ''}

    <div class="ps"><div class="ps-head">📊 Bugünkü Aktivite</div><div class="ps-body">${activitySummary}</div></div>
  `;
}

// ══════════════════════════════════════════════
// RAPORLAR / ANALİTİK
// ══════════════════════════════════════════════
async function renderAnalytics(){
  const d = await api('getAnalytics');
  const main = document.getElementById('main');
  if(!d.success){ main.innerHTML='<div class="empty">Yüklenemedi</div>'; return; }

  const maxReached = Math.max(1, ...d.funnel.map(f=>f.reached));
  const funnelHtml = d.funnel.map((f,i)=>{
    const pct = Math.round((f.reached/maxReached)*100);
    const color = STAGE_COLORS[f.stage] || '#8B949E';
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px"><span>${f.stage}</span><b style="color:${color}">${f.reached}</b></div>
      <div style="background:var(--bg-raised);border-radius:6px;height:10px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color}"></div></div>
    </div>`;
  }).join('');

  const sourceRows = d.sourcePerformance.map(s=>`
    <tr><td><b>${esc(s.source)}</b></td><td>${s.total}</td><td>${s.won}</td>
      <td><span style="color:${s.conversionRate>=20?'var(--green)':'var(--muted)'};font-weight:700">%${s.conversionRate}</span></td>
      <td style="color:var(--green);font-weight:700">₺${s.wonMrr.toLocaleString('tr-TR')}</td></tr>`).join('');

  const lostRows = Object.entries(d.lostReasons).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>`
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-subtle);font-size:12.5px">
      <span>${esc(reason)}</span><b style="color:var(--red)">${count}</b>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12px">Henüz kayıp fırsat yok.</div>';

  main.innerHTML = `
    <div class="page-head"><div><h1>📈 Raporlar</h1><p>Huni dönüşümü, kaynak performansı ve kayıp analizleri.</p></div></div>
    <div class="stats">
      <div class="stat" style="--stat-color:#58A6FF"><div class="icon" style="background:#58A6FF22;color:#58A6FF">📊</div><div><div class="n">${d.totalOpportunities}</div><div class="l">Toplam Fırsat</div></div></div>
      <div class="stat" style="--stat-color:#3FB950"><div class="icon" style="background:#3FB95022;color:#3FB950">🎉</div><div><div class="n">${d.wonCount}</div><div class="l">Kazanılan</div></div></div>
      <div class="stat" style="--stat-color:#F85149"><div class="icon" style="background:#F8514922;color:#F85149">📉</div><div><div class="n">${d.lostCount}</div><div class="l">Kaybedilen</div></div></div>
      <div class="stat" style="--stat-color:#3ECF8E"><div class="icon" style="background:#3ECF8E22;color:#3ECF8E">💰</div><div><div class="n">₺${Math.round(d.avgDealValue).toLocaleString('tr-TR')}</div><div class="l">Ortalama Anlaşma</div></div></div>
    </div>

    <div class="ps"><div class="ps-head">Huni Dönüşümü — Bu aşamaya kadar ulaşan fırsat sayısı</div><div class="ps-body">${funnelHtml}</div></div>

    <div class="ps"><div class="ps-head">Kaynak Bazlı Performans</div>
      <div class="ps-body" style="padding:0">
        <table><thead><tr><th>Kaynak</th><th>Toplam</th><th>Kazanılan</th><th>Dönüşüm</th><th>Kazanılan MRR</th></tr></thead>
        <tbody>${sourceRows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">Henüz veri yok</td></tr>'}</tbody></table>
      </div>
    </div>

    <div class="ps"><div class="ps-head" style="color:var(--red)">Kayıp Sebep Dağılımı</div><div class="ps-body">${lostRows}</div></div>
  `;
}

async function renderCompanies(){
  const d = await api('getCompanies');
  companies = d.companies || [];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head">
      <div><h1>Şirketler</h1><p>${companies.length} potansiyel/mevcut şirket</p></div>
      <button class="btn-add" onclick="openAddCompanyModal()">+ Yeni Şirket</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Şirket</th><th>Sektör</th><th>Ülke</th><th>Kaynak</th><th>Aşama</th><th>Lead Score</th><th>Tahmini MRR</th><th>Durum</th></tr></thead>
        <tbody>${companies.length===0?'<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">Henüz şirket yok</td></tr>':companies.map(c=>`
          <tr class="row-click" onclick="openCompanyPanel('${c.id}')">
            <td><b>${esc(c.name)}</b>${c.priority==='High'?' 🔥':''}</td>
            <td>${esc(c.industry||'—')}</td>
            <td>${esc(c.country||'—')}</td>
            <td>${c.lead_source?`<span class="badge badge-source">${esc(c.lead_source)}</span>`:'—'}</td>
            <td>${c.current_stage?`<span style="color:${STAGE_COLORS[c.current_stage]||'#666'};font-weight:700;font-size:11.5px">${esc(c.current_stage)}</span>`:'—'}</td>
            <td><span style="color:${leadScoreColor(c.lead_score||0)};font-weight:700">${c.lead_score||0}</span></td>
            <td>${c.current_mrr?'₺'+Number(c.current_mrr).toLocaleString('tr-TR'):'—'}</td>
            <td>${c.is_customer?'<span class="badge" style="background:var(--green-bg);color:var(--green)">Müşteri</span>':'<span class="badge" style="background:var(--surface-2);border:1px solid var(--border);color:var(--muted)">Aday</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function openAddCompanyModal(){ document.getElementById('addCompanyModal').classList.add('open'); }
function closeAddCompanyModal(){
  document.getElementById('addCompanyModal').classList.remove('open');
  ['name','industry','country','website','notes'].forEach(k=>document.getElementById('nc-'+k).value='');
  document.getElementById('nc-source').value='';
  document.getElementById('nc-priority').value='Normal';
}
async function submitAddCompany(){
  const name = document.getElementById('nc-name').value.trim();
  if(!name){ toast('Şirket adı zorunludur'); return; }
  const company = {
    name, industry: document.getElementById('nc-industry').value.trim(),
    country: document.getElementById('nc-country').value.trim(),
    website: document.getElementById('nc-website').value.trim(),
    lead_source: document.getElementById('nc-source').value,
    priority: document.getElementById('nc-priority').value,
    research_notes: document.getElementById('nc-notes').value.trim(),
  };
  const d = await api('addCompany', { company });
  if(d.success){
    toast('✓ Şirket eklendi');
    closeAddCompanyModal();
    if(currentPage==='companies') renderCompanies(); else if(currentPage==='pipeline') renderPipeline();
    // ilk fırsatı da otomatik oluşturalım ki hemen pipeline'da görünsün
    await api('addOpportunity', { companyId: d.company.id, opportunity:{stage:'Prospect'} });
  }
}

function closeCompanyPanel(){ document.getElementById('companyOverlay').classList.remove('open'); }

async function saveCompanyProfile(companyId){
  const company = {
    industry: document.getElementById('ec-industry').value.trim(),
    country: document.getElementById('ec-country').value.trim(),
    website: document.getElementById('ec-website').value.trim(),
    company_size: document.getElementById('ec-size').value.trim(),
    instagram: document.getElementById('ec-instagram').value.trim(),
    linkedin: document.getElementById('ec-linkedin').value.trim(),
    current_crm: document.getElementById('ec-crm').value.trim(),
    lead_source: document.getElementById('ec-source').value,
    pain_point: document.getElementById('ec-pain').value.trim(),
    priority: document.getElementById('ec-priority').value,
    research_notes: document.getElementById('ec-notes').value.trim(),
  };
  const d = await api('updateCompany', { companyId, company });
  if(d.success){ toast('✓ Kaydedildi'); }
}

async function quickAddOpportunity(companyId){
  const d = await api('addOpportunity', { companyId, opportunity:{stage:'Prospect'} });
  if(d.success){ toast('✓ Fırsat eklendi'); openCompanyPanel(companyId); }
}
async function moveOpportunityStage(opportunityId, newStage, companyId){
  let lostReason = null;
  if(newStage === 'Lost'){ lostReason = prompt('Kayıp sebebi (isteğe bağlı): Too expensive, No need, No budget, Using another CRM, Bad timing, No response, Not decision maker, Competitor, Other') || ''; }
  const d = await api('updateOpportunityStage', { opportunityId, stage:newStage, lostReason });
  if(d.success){ toast('✓ Aşama güncellendi: ' + newStage); openCompanyPanel(companyId); if(currentPage==='pipeline') renderPipeline(); }
}

function showAddContactForm(companyId){ document.getElementById('addContactForm-'+companyId).classList.remove('hidden'); }
async function submitAddContact(companyId){
  const contact = {
    full_name: document.getElementById('nct-name').value.trim(),
    position: document.getElementById('nct-pos').value.trim(),
    email: document.getElementById('nct-email').value.trim(),
    phone: document.getElementById('nct-phone').value.trim(),
    linkedin: document.getElementById('nct-linkedin').value.trim(),
    is_decision_maker: document.getElementById('nct-decision').checked,
  };
  if(!contact.full_name){ toast('İsim zorunludur'); return; }
  const d = await api('addContact', { companyId, contact });
  if(d.success){ toast('✓ Kişi eklendi'); openCompanyPanel(companyId); }
}

function showAddTaskForm(companyId){ document.getElementById('addTaskForm-'+companyId).classList.remove('hidden'); }
async function submitAddTask(companyId){
  const task = { title: document.getElementById('ntk-title').value.trim(), due_date: document.getElementById('ntk-due').value || null };
  if(!task.title){ toast('Görev başlığı zorunludur'); return; }
  const d = await api('addTask', { companyId, task });
  if(d.success){ toast('✓ Görev eklendi'); openCompanyPanel(companyId); }
}
async function completeTaskQuick(taskId, companyId){
  const d = await api('completeTask', { taskId });
  if(d.success){ toast('✓ Görev tamamlandı'); openCompanyPanel(companyId); }
}
async function deleteCompanyConfirm(companyId){
  if(!confirm('Bu şirketi ve tüm ilişkili kayıtları silmek istediğinize emin misiniz?')) return;
  const d = await api('deleteCompany', { companyId });
  if(d.success){ toast('🗑 Şirket silindi'); closeCompanyPanel(); renderCompanies(); }
}

// ══════════════════════════════════════════════
// PIPELINE (Kanban, sürükle-bırak)
// ══════════════════════════════════════════════
async function renderPipeline(){
  const d = await api('getOpportunities');
  opportunities = d.opportunities || [];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head"><div><h1>Pipeline</h1><p>Kartları sürükleyip bırakarak aşama değiştirebilirsiniz.</p></div></div>
    <div class="board">
      ${STAGES.map(s=>{
        const items = opportunities.filter(o=>o.stage===s);
        return `<div class="col">
          <div class="col-head" style="background:${STAGE_COLORS[s]}18;color:${STAGE_COLORS[s]}">${s}<span>${items.length}</span></div>
          <div class="col-body" data-stage="${s}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropCard(event,'${s}')">
            ${items.map(o=>`
              <div class="kcard" draggable="true" ondragstart="onDragStart(event,'${o.id}')" onclick="openCompanyPanel('${o.company_id}')">
                <b>${esc(o.companies?.name||'—')}</b>
                <div style="color:var(--muted)">${esc(o.companies?.country||'')}</div>
                <div class="meta"><span class="mrr">${o.estimated_mrr?'₺'+Number(o.estimated_mrr).toLocaleString('tr-TR'):''}</span><span>${daysSince(o.stage_changed_at)}g</span></div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
let draggedOppId = null;
function onDragStart(e, oppId){ draggedOppId = oppId; }
async function onDropCard(e, newStage){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  if(!draggedOppId) return;
  let lostReason = null;
  if(newStage === 'Lost'){ lostReason = prompt('Kayıp sebebi (isteğe bağlı):') || ''; }
  const d = await api('updateOpportunityStage', { opportunityId: draggedOppId, stage: newStage, lostReason });
  if(d.success){ toast('✓ ' + newStage + ' aşamasına taşındı'); renderPipeline(); }
  draggedOppId = null;
}

// ══════════════════════════════════════════════
// GÖREVLER
// ══════════════════════════════════════════════
async function renderTasks(){
  const d = await api('getTasks');
  tasks = d.tasks || [];
  const today = new Date().toISOString().slice(0,10);
  const overdue = tasks.filter(t=>t.due_date && t.due_date < today);
  const todayT = tasks.filter(t=>t.due_date === today);
  const upcoming = tasks.filter(t=>t.due_date && t.due_date > today);
  const noDate = tasks.filter(t=>!t.due_date);

  function section(title, list, color){
    if(list.length===0) return '';
    return `<div class="ps"><div class="ps-head" style="color:${color}">${title} (${list.length})</div>
      <div class="ps-body mini-list">${list.map(t=>`
        <div class="mini-item" style="display:flex;justify-content:space-between;align-items:center">
          <span><b>${esc(t.companies?.name||'')}</b> — ${esc(t.title)} ${t.due_date?`<span style="color:var(--muted)">· ${t.due_date}</span>`:''}</span>
          <span style="cursor:pointer;color:var(--green);font-size:11px" onclick="completeTaskFromList('${t.id}')">Tamamla</span>
        </div>`).join('')}</div></div>`;
  }
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h1>Görevler</h1><p>${tasks.length} açık görev</p></div></div>
    ${section('🔴 Geciken', overdue, 'var(--red)')}
    ${section('🟡 Bugün', todayT, 'var(--amber)')}
    ${section('🟢 Yaklaşan', upcoming, 'var(--green)')}
    ${section('Tarihsiz', noDate, 'var(--muted)')}
    ${tasks.length===0?'<div class="empty">Açık görev yok — harika!</div>':''}
  `;
}
async function completeTaskFromList(taskId){
  const d = await api('completeTask', { taskId });
  if(d.success){ toast('✓ Tamamlandı'); renderTasks(); }
}

// ── Yardımcılar ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function fmtDT(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return 0; return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/86400000)); }
function initials(name){
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  const first = parts[0]?.[0] || '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}
function leadScoreColor(score){
  if(score>=70) return '#3FB950';   // yüksek — yeşil
  if(score>=40) return '#D29922';   // orta — amber
  return '#8B949E';                 // düşük — gri
}
