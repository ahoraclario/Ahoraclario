<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahoraclario — Sales CRM</title>
<style>
:root{
  /* Ahoraclario Design System — Part 13 spec'indeki birebir hex değerleri */
  --bg:#070B14; --bg-raised:#080D18; --surface:#0D1421; --surface-2:#111B2B;
  --surface-secondary:#0A101C; --opp-card:#0F1826;
  --border:#1B2A3A; --border-subtle:#172435; --border-hover:#29415A;
  --text:#F0F6FC; --muted:#8B9AAF; --faint:#596579;
  --primary:#39D98A; --primary-dark:#2BC27A; --primary-bg:rgba(57,217,138,.14);
  --blue:#3B82F6; --blue-bg:rgba(59,130,246,.14);
  --cyan:#22D3EE; --cyan-bg:rgba(34,211,238,.14);
  --green:#39D98A; --green-bg:rgba(57,217,138,.14);
  --amber:#F59E0B; --amber-bg:rgba(245,158,11,.14);
  --red:#F87171; --red-bg:rgba(248,113,113,.14);
  --purple:#A78BFA; --purple-bg:rgba(167,139,250,.14);
  --glow-primary:0 0 0 1px rgba(57,217,138,.15), 0 8px 24px rgba(57,217,138,.10);
  --glow-blue:0 0 0 1px rgba(59,130,246,.15), 0 8px 24px rgba(59,130,246,.10);
  /* eski isimlerle geriye dönük uyum */
  --ink:var(--text); --line:var(--border); --card:var(--surface);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color-scheme:dark}
a{color:var(--blue);text-decoration:none}
.hidden{display:none !important}
::selection{background:var(--primary-bg);color:var(--primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---- Login ---- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg)}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(600px circle at 20% 20%, rgba(62,207,142,.10), transparent 55%),
    radial-gradient(500px circle at 85% 75%, rgba(88,166,255,.08), transparent 55%);
  pointer-events:none;
}
#login-screen::after{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(var(--border-subtle) 1px, transparent 1px),linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
  background-size:42px 42px;opacity:.35;mask-image:radial-gradient(circle at 50% 40%, black, transparent 70%);pointer-events:none;
}
.login-box{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:40px;width:100%;max-width:380px}
.login-logo{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#22946A);display:flex;align-items:center;justify-content:center;color:#04170F;font-weight:800;font-size:19px;margin-bottom:20px;box-shadow:0 0 0 1px rgba(62,207,142,.3),0 8px 24px rgba(62,207,142,.25)}
.login-box h1{font-size:20px;margin:0 0 4px;color:var(--text);letter-spacing:-.2px}
.login-box p{color:var(--muted);font-size:13px;margin:0 0 26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface-2);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.btn{border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--primary);color:#04170F;width:100%}
.btn-primary:hover{background:var(--primary-dark)}
.login-err{color:var(--red);background:var(--red-bg);border:1px solid rgba(248,81,73,.3);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none}

/* ---- App shell ---- */
#app{display:none}
#app.open{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--bg-raised);border-right:1px solid var(--border-subtle);padding:18px 14px;display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.sb-logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--cyan));color:#04170F;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:var(--glow-primary)}
.sb-logo b{font-size:14.5px;color:var(--text);letter-spacing:-.1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;border:none;border-left:3px solid transparent;background:none;width:100%;text-align:left;transition:background .12s,color .12s,border-color .12s}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg, var(--primary-bg), transparent);color:var(--primary);border-left-color:var(--primary)}
.nav-item .nb{margin-left:auto;font-size:10px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:20px;padding:1px 7px}
.nav-item.active .nb{background:var(--primary-bg);color:var(--primary)}
.sb-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-subtle)}
.sb-tagline{font-size:11.5px;color:var(--faint);padding:0 8px;line-height:1.5}

.content-area{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;flex-shrink:0;border-bottom:1px solid var(--border-subtle);background:var(--bg-raised);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
.search-box{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--faint);font-size:13px}
.search-box input{border:none;background:none;outline:none;color:var(--text);font-size:13px;flex:1;padding:0}
.search-box input::placeholder{color:var(--faint)}
.search-box kbd{font-size:10.5px;color:var(--faint);background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;font-family:inherit}
.search-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:100%;min-width:320px;max-height:400px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-hover);border-radius:10px;box-shadow:0 16px 40px -12px rgba(0,0,0,.6);z-index:50;padding:6px}
.search-group-label{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 4px}
.search-result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.search-result-row:hover{background:var(--surface-2)}
.search-result-row b{color:var(--text)}
.search-result-row .meta{color:var(--muted);font-size:11px}
.search-empty{padding:14px 10px;color:var(--muted);font-size:12px;text-align:center}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg-raised)}
.notif-item{display:flex;gap:9px;padding:10px;border-radius:7px;cursor:pointer;font-size:12px}
.notif-item:hover{background:var(--surface-2)}
.notif-item .nd{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.user-chip{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 6px;border-radius:9px}
.user-chip:hover{background:var(--surface)}
.user-chip .avatar{width:32px;height:32px;font-size:12.5px}
.user-chip b{font-size:12.5px;color:var(--text);display:block;line-height:1.3}
.user-chip span{font-size:10.5px;color:var(--muted)}

.main{flex:1;padding:26px 32px;overflow-x:hidden;overflow-y:auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:21px;margin:0 0 4px;color:var(--text);letter-spacing:-.2px}
.page-head p{color:var(--muted);font-size:13px;margin:0}

/* ---- Stat cards ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:22px}
.stat{background:linear-gradient(165deg, var(--surface) 0%, var(--bg-raised) 100%);border:1px solid var(--border-subtle);border-radius:11px;padding:13px 14px 11px;transition:border-color .15s,transform .15s,box-shadow .15s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:7px}
.stat:hover{border-color:var(--border);border-color:color-mix(in srgb, var(--stat-color, var(--primary)) 45%, var(--border));transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--stat-color,var(--primary));box-shadow:0 0 10px var(--stat-color,var(--primary))}
.stat .icon{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.stat .l{font-size:11px;color:var(--muted);font-weight:500}
.stat .value-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.stat .n{font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1}
.stat .trend{font-size:10px;font-weight:700}
.stat .trend.up{color:var(--green)} .stat .trend.flat{color:var(--faint)}
.stat .spark-wrap{margin-top:1px;line-height:0}
.stat .spark-wrap svg{width:100%;height:26px;display:block}

/* ---- Table ---- */
.tbl-wrap{background:var(--surface);border:1px solid var(--border-subtle);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 14px;background:var(--bg-raised);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--border-subtle)}
td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text)}
tr:last-child td{border-bottom:none}
tr.row-click{cursor:pointer;transition:background .1s}
tr.row-click:hover{background:var(--surface-2)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge-source{background:var(--blue-bg);color:var(--blue)}

/* ---- Dashboard: 2 sütunlu layout, sparkline, donut, yan panel ---- */
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:1100px){.dash-grid{grid-template-columns:1fr}}
.dash-main{min-width:0}
.dash-side{display:flex;flex-direction:column;gap:14px}

.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:128px;height:128px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.donut-center{position:absolute;inset:24px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-legend{flex:1;min-width:160px;font-size:11.5px}
.donut-legend-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.donut-legend-row .val{margin-left:auto;font-weight:700;color:var(--text)}

.mini-kanban{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.mini-col{flex:0 0 148px}
.mini-col-head{font-size:10.5px;font-weight:700;padding:6px 9px;border-radius:7px 7px 0 0;color:#06090F}
.mini-col-body{background:var(--bg-raised);border:1px solid var(--border-subtle);border-top:none;border-radius:0 0 7px 7px;min-height:50px;padding:6px;display:flex;flex-direction:column;gap:6px}
.mini-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:6px;padding:7px 8px;font-size:10.5px;cursor:pointer}
.mini-card:hover{border-color:var(--border)}
.mini-card b{display:block;font-size:10.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.side-card{background:var(--surface);border:1px solid var(--border-subtle);border-radius:12px;padding:15px}
.side-card-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:11px}
.side-card-head a{font-size:11px;color:var(--primary);cursor:pointer;font-weight:600}
.action-item{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:12px;cursor:pointer}
.action-item:last-child{border-bottom:none}
.action-item .chk{width:15px;height:15px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px}
.action-item .chk:hover{border-color:var(--primary)}
.action-item .at-body{flex:1;min-width:0}
.action-item .at-time{color:var(--muted);font-size:10.5px}
.action-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;flex-shrink:0;white-space:nowrap}
.activity-item{display:flex;gap:9px;padding:7px 0;font-size:11.5px}
.activity-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-item .ai-time{color:var(--faint);font-size:10px;margin-left:auto;flex-shrink:0;padding-left:8px}

/* ---- Buttons ---- */
.btn-add{background:var(--primary);color:#07110C;border:none;border-radius:8px;height:36px;padding:0 18px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn-add:hover{background:var(--primary-dark)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 15px;font-size:12.5px;font-weight:700}
.btn-ghost:hover{border-color:var(--faint)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,81,73,.25);border-radius:8px;padding:9px 15px;font-size:12.5px;font-weight:700}

/* ---- Kanban ---- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px}
.col{flex:0 0 240px;display:flex;flex-direction:column}
.col-head{padding:10px 13px;border-radius:10px 10px 0 0;font-size:12px;font-weight:700;display:flex;justify-content:space-between;color:#0A0E1A;letter-spacing:.01em}
.col-head .count{background:rgba(10,14,26,.22);border-radius:20px;padding:1px 8px;font-size:10.5px}
.col-body{background:var(--surface);border:1px solid var(--border-subtle);border-top:none;border-radius:0 0 10px 10px;flex:1;min-height:100px;padding:9px;display:flex;flex-direction:column;gap:8px}
.col-body.dragover{background:var(--primary-bg)}
.kcard{background:var(--bg-raised);border:1px solid var(--border-subtle);border-left:3px solid var(--stat-color,var(--border));border-radius:8px;padding:10px 11px;cursor:grab;font-size:12.5px;transition:border-color .12s,transform .1s}
.kcard:hover{border-color:var(--border);transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--text)}
.kcard .meta{color:var(--muted);font-size:10.5px;display:flex;justify-content:space-between;margin-top:5px}
.kcard .mrr{color:var(--green);font-weight:700}

/* ---- Panel (slide-over) ---- */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.65);display:none;align-items:center;justify-content:flex-end;z-index:200;backdrop-filter:blur(2px)}
.overlay.open{display:flex}
.panel{background:var(--bg);height:100%;width:100%;max-width:560px;overflow-y:auto;padding:26px;border-left:1px solid var(--border-subtle)}
.panel-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.panel-close{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;width:30px;height:30px;font-size:15px;color:var(--muted);cursor:pointer}
.panel-close:hover{color:var(--text)}
.ps{border:1px solid var(--border-subtle);border-radius:10px;margin-bottom:14px;background:var(--surface)}
.ps-head{padding:10px 14px;background:var(--bg-raised);border-bottom:1px solid var(--border-subtle);border-radius:10px 10px 0 0;font-size:12.5px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;letter-spacing:.01em}
.ps-head span{text-transform:none;letter-spacing:0;font-weight:600;color:var(--primary)}
.ps-body{padding:14px}
.fi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fi{margin-bottom:10px}
.fi label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fi input,.fi select,.fi textarea{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:var(--surface-secondary);color:var(--text)}
.fi textarea{min-height:auto}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.mini-list{display:flex;flex-direction:column;gap:7px}
.mini-item{border:1px solid var(--border-subtle);border-radius:8px;padding:9px 11px;font-size:12px;background:var(--bg-raised);color:var(--text)}
.mini-item b{font-size:12.5px}
.contact-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border-subtle);border-radius:8px;padding:9px 11px;background:var(--bg-raised)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex-shrink:0}
.timeline-item{padding:9px 0;border-bottom:1px solid var(--border-subtle);font-size:12.5px;color:var(--text);position:relative;padding-left:16px}
.timeline-item::before{content:'';position:absolute;left:0;top:14px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.timeline-item:last-child{border-bottom:none}
.timeline-item .t{color:var(--muted);font-size:10.5px;margin-top:2px}
.stage-track{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stage-pill{font-size:9.5px;padding:3px 8px;border-radius:12px;cursor:pointer;font-weight:700;border:1px solid transparent;transition:transform .1s}
.stage-pill:hover{transform:translateY(-1px)}

/* ---- Modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(1,4,9,.65);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal h3{margin:0 0 16px;font-size:16px;color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1}

.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 18px;border-radius:9px;font-size:13px;z-index:400;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{display:block}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">A</div>
    <h1>Ahoraclario</h1>
    <p>Sign in to your Founder Sales CRM.</p>
    <div class="login-err" id="loginErr"></div>
    <div class="field"><label>Username</label><input id="li-user" type="text"></div>
    <div class="field"><label>Password</label><input id="li-pass" type="password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sb-logo"><div class="mark">A</div><b>Ahoraclario</b></div>
    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">📊 Dashboard</button>
    <button class="nav-item" data-page="myday" onclick="showPage('myday')">☀️ My Day<span class="nb hidden" id="nbMyDay"></span></button>
    <button class="nav-item" data-page="pipeline" onclick="showPage('pipeline')">🧭 Pipeline</button>
    <button class="nav-item" data-page="companies" onclick="showPage('companies')">🏢 Companies<span class="nb hidden" id="nbCompanies"></span></button>
    <button class="nav-item" data-page="tasks" onclick="showPage('tasks')">✅ Tasks<span class="nb hidden" id="nbTasks"></span></button>
    <button class="nav-item" data-page="analytics" onclick="showPage('analytics')">📈 Reports</button>
    <button class="nav-item" data-page="settings" onclick="showPage('settings')">⚙️ Settings</button>
    <div class="sb-bottom">

<script>
// 🔧 DEĞİŞTİRİN: Supabase Edge Function adresiniz
const EDGE_FUNCTION_URL = 'https://tuozgfnjxxwrcuyfrwxq.supabase.co/functions/v1/rapid-service';

const STAGES = ["Prospect","Researched","Contacted","Replied","Discovery Call","Demo","Proposal","Negotiation","Won"];
const STAGE_COLORS = {Prospect:"#64748B",Researched:"#3B82F6",Contacted:"#22D3EE",Replied:"#38BDF8",
  "Discovery Call":"#818CF8","Demo":"#A78BFA","Proposal":"#C084FC","Negotiation":"#F59E0B","Won":"#39D98A"};
const OUTCOME_COLORS = {Lost:"#F87171","No Response":"#596579","Not a Fit":"#596579"};

let CU = null; // { token, name, username }
let companies = [], opportunities = [], tasks = [];
let currentPage = 'dashboard';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

async function api(action, params={}){
  try{
    const res = await fetch(EDGE_FUNCTION_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, token: CU?.token, ...params })
    });
    const d = await res.json();
    if(!d.success){
      if(d.error?.status === 401){ doLogout(true); }
      toast('Hata: ' + (d.error?.message || 'Bilinmeyen hata'));
    }
    return d;
  }catch(e){ toast('Connection error'); return {success:false}; }
}

// ── GİRİŞ ──
async function doLogin(){
  const username = document.getElementById('li-user').value.trim();
  const password = document.getElementById('li-pass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display='none';
  if(!username || !password){ errEl.textContent='Username and password are required'; errEl.style.display='block'; return; }
  const d = await api('login', { username, password });
  if(!d.success){ errEl.textContent = d.error?.message || 'Login failed'; errEl.style.display='block'; return; }
  CU = { token: d.token, name: d.user.name, username: d.user.username };
  sessionStorage.setItem('ahoraclario_session', JSON.stringify(CU));
  enterApp();
}
function doLogout(silent){
  if(CU && !silent) api('logout');
  CU = null;

  document.getElementById('app').classList.remove('open');
  document.getElementById('login-screen').style.display='flex';
}

    if(!arr || arr.length<2) return 0;

    const secondHalf = arr.slice(Math.floor(arr.length/2)).reduce((a,b)=>a+b,0);

    return Math.round(((secondHalf-firstHalf)/firstHalf)*100);

    return `<div class="stat" style="--stat-color:${color}">

function sparkline(data, color){
  const w=100,h=32;   // viewBox koordinat sistemi — CSS ile %100 genişliğe esner (preserveAspectRatio="none")
  const max = Math.max(1, ...data);
  const hasSignal = data.some(v=>v>0);
  const c = hasSignal ? color : '#3A4363';   // hiç veri yoksa soluk gri çizgi, göz yormasın
  const pts = data.map((v,i)=>{
    const x = data.length>1 ? (i/(data.length-1))*w : w/2;
    const y = h - (v/max)*h*0.78 - 3;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const area = `0,${h} ${pts} ${w},${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${area}" fill="${c}22" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>`;
}

function donutChart(segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let acc = 0;
  const stops = segments.map(seg=>{
    const start = (acc/total)*360; acc += seg.value;
    const end = (acc/total)*360;
    return `${seg.color} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`;
  }).join(', ');
  return `<div class="donut" style="background:conic-gradient(${stops})">
    <div class="donut-center"><b style="font-size:19px">${total}</b><span style="font-size:9px;color:var(--muted)">Total</span></div>
  </div>`;
}

function renderFunnelChevron(funnel){
  const maxReached = Math.max(1, ...funnel.map(f=>f.reached));
  return `<div style="display:flex;overflow-x:auto;padding:8px 4px 2px">
    ${funnel.map((f,i)=>{
      const color = STAGE_COLORS[f.stage] || '#64748B';
      const nextColor = STAGE_COLORS[funnel[i+1]?.stage] || color;
      const isFirst = i===0;
      const pctOfFirst = funnel[0].reached>0 ? Math.round((f.reached/funnel[0].reached)*100) : 0;
      return `<div style="flex:1;min-width:80px;position:relative">
        <div style="height:52px;background:linear-gradient(100deg, ${color}, ${nextColor});clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%${isFirst?'':', 14px 50%'});display:flex;flex-direction:column;align-items:center;justify-content:center;color:#06090F;margin-left:${isFirst?'0':'-14px'}">
          <b style="font-size:14px;line-height:1">${f.reached}</b>
          <span style="font-size:8.5px;font-weight:700;opacity:.75">${i===0?'':'%'+pctOfFirst}</span>
        </div>
        <div style="text-align:center;font-size:9.5px;color:var(--muted);margin-top:5px;padding:0 2px">${f.stage}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function timeAgo(iso){
  if(!iso) return '';
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins<1) return 'now';
  if(mins<60) return mins+'dk';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+'sa';
  return Math.floor(hrs/24)+'g';
}

async function renderMyDay(){

  const main = document.getElementById('main');
  if(!d.success){ main.innerHTML='<div class="empty">Failed to load</div>'; return; }
  const targets = settingsRes.success ? (settingsRes.dailyTargets||{}) : {};

  function taskRow(t, color){
    return `<div class="mini-item" style="display:flex;justify-content:space-between;align-items:center;border-left:3px solid ${color}">
      <span onclick="openCompanyPanel('${t.company_id}')" style="cursor:pointer"><b>${esc(t.companies?.name||'')}</b> — ${esc(t.title)} ${t.due_date?`<span style="color:var(--muted)">· ${t.due_date}</span>`:''}</span>
      <span style="cursor:pointer;color:var(--green);font-size:11px;flex-shrink:0;margin-left:10px" onclick="completeTaskFromList('${t.id}')">Complete</span>
    </div>`;
  }
  function demoMeetingRow(m){
    return `<div class="mini-item" style="display:flex;justify-content:space-between;align-items:center;border-left:3px solid #A78BFA">

    </div>`;
  }
  function section(title, color, bodyHtml, count){
    return `<div class="ps"><div class="ps-head" style="color:${color}">${title}${count!==undefined?` (${count})`:''}</div><div class="ps-body mini-list">${bodyHtml}</div></div>`;
  }

  const activitySummary = [
    ['email_sent','📧 Emails','emails'], ['linkedin_message','💼 LinkedIn','linkedin'], ['call','📞 Calls','calls'],
    ['reply_received','↩️ Replies',null], ['demo_completed','🖥️ Demos','demos'], ['proposal_sent','📄 Proposals',null],
  ].map(([type,label,targetKey]) => {

  }).join('') + `<span style="cursor:pointer;color:var(--primary);font-size:11px;margin-left:6px" onclick="showPage('settings')">Edit targets →</span>`;

  main.innerHTML = `
    <div class="page-head"><div><h1>☀️ My Day</h1><p>Everything you need to focus on today.</p></div></div>

    ${d.overdueTasks.length ? section('🔴 Overdue Follow-ups', 'var(--red)', d.overdueTasks.map(t=>taskRow(t,'#F87171')).join(''), d.overdueTasks.length) : ''}
    ${section('📩 Follow-ups Today', 'var(--amber)', d.todayTasks.length?d.todayTasks.map(t=>taskRow(t,'#F59E0B')).join(''):'<div style="color:var(--muted);font-size:12px">No tasks for today.</div>', d.todayTasks.length)}

    ${d.demosToday.length ? section('🖥️ Today\'s Demos', 'var(--purple)', d.demosToday.map(m=>demoMeetingRow(m)).join(''), d.demosToday.length) : ''}

    ${section('🎯 Not Yet Contacted Prospects', 'var(--blue)',
      d.notContacted.length?d.notContacted.map(c=>`<div class="mini-item" style="cursor:pointer" onclick="openCompanyPanel('${c.companyId}')"><b>${esc(c.companyName||'—')}</b> <span style="color:var(--muted)">— no contact logged yet</span></div>`).join(''):'<div style="color:var(--muted);font-size:12px">Great, everyone has been contacted!</div>',
      d.notContacted.length)}

    ${section('💰 Proposals Awaiting Response', 'var(--green)',
      d.openProposals.length?d.openProposals.map(o=>`<div class="mini-item" style="cursor:pointer" onclick="openCompanyPanel('${o.company_id}')"><b>${esc(o.companies?.name||'—')}</b> <span style="color:var(--green);font-weight:700">${o.mrr?'₺'+Number(o.mrr).toLocaleString('tr-TR')+'/mo':(o.value?'₺'+Number(o.value).toLocaleString('tr-TR'):'—')}</span> <span class="badge" style="background:var(--surface-2);color:var(--muted);margin-left:6px">${esc(o.status)}</span></div>`).join(''):'<div style="color:var(--muted);font-size:12px">No pending proposals.</div>',
      d.openProposals.length)}

    ${d.upcomingTasks.length ? section('🟢 Upcoming (7 days)', 'var(--green)', d.upcomingTasks.map(t=>taskRow(t,'#39D98A')).join(''), d.upcomingTasks.length) : ''}

    <div class="ps"><div class="ps-head">📊 Today's Activity</div><div class="ps-body">${activitySummary}</div></div>
  `;
}

async function renderAnalytics(){

  const donutColors = ['#3B82F6','#22D3EE','#A78BFA','#39D98A','#F59E0B','#FB923C','#F87171','#64748B'];
  const sourcesWithData = d.sourcePerformance.filter(s=>s.total>0);
  const donutHtml = sourcesWithData.length ? donutChart(sourcesWithData.map((s,i)=>({label:s.source, value:s.total, color:donutColors[i%donutColors.length]}))) : '<div class="empty" style="padding:20px">No data yet</div>';
  const donutLegend = sourcesWithData.map((s,i)=>`<div class="donut-legend-row"><span class="dot" style="background:${donutColors[i%donutColors.length]}"></span>${esc(s.source)}<span class="val">${s.total}</span></div>`).join('');

  const sourceRows = d.sourcePerformance.map(s=>`
    <tr class="row-click" onclick="showPage('companies', null, '${escAttr(s.source)}')"><td><b>${esc(s.source)}</b></td><td>${s.total}</td><td>${s.won}</td>

      <td style="color:var(--green);font-weight:700">₺${s.wonMrr.toLocaleString('tr-TR')}</td></tr>`).join('');

  const lostRows = Object.entries(d.lostReasons).sort((a,b)=>b[1]-a[1]).map(([reason,count])=>`
    <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-subtle);font-size:12.5px">
      <span>${esc(reason)}</span><b style="color:var(--red)">${count}</b>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12px">No lost opportunities yet.</div>';

  main.innerHTML = `
    <div class="page-head"><div><h1>📈 Reports</h1><p>Funnel conversion, source performance, and loss analysis.</p></div></div>
    <div class="stats">
      <div class="stat" style="--stat-color:#3B82F6"><div class="icon" style="background:#3B82F622;color:#3B82F6">📊</div><div><div class="n">${d.totalOpportunities}</div><div class="l">Total Opportunities</div></div></div>
      <div class="stat" style="--stat-color:#39D98A"><div class="icon" style="background:#39D98A22;color:#39D98A">🎉</div><div><div class="n">${d.wonCount}</div><div class="l">Won</div></div></div>
      <div class="stat" style="--stat-color:#F87171"><div class="icon" style="background:#F8717122;color:#F87171">📉</div><div><div class="n">${d.lostCount}</div><div class="l">Lost</div></div></div>
      <div class="stat" style="--stat-color:#39D98A"><div class="icon" style="background:#39D98A22;color:#39D98A">💰</div><div><div class="n">₺${Math.round(d.avgDealValue).toLocaleString('tr-TR')}</div><div class="l">Avg. Deal Value</div></div></div>
    </div>

    <div class="ps"><div class="ps-head">Funnel Conversion — Opportunities that reached this stage</div><div class="ps-body">${renderFunnelChevron(d.funnel)}</div></div>

    <div class="ps"><div class="ps-head">Stage-to-Stage Conversion</div>
      <div class="ps-body" style="display:flex;flex-wrap:wrap;gap:12px">
        ${(d.stepConversion||[]).map(s=>{
          const color = s.rate>=40?'#39D98A':(s.rate>=15?'#F59E0B':'#F87171');
          return `<div style="flex:1;min-width:150px;background:var(--surface-secondary);border:1px solid var(--border-subtle);border-radius:10px;padding:12px">
            <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${esc(s.label)}</div>
            <div style="font-size:20px;font-weight:800;color:${color}">%${s.rate}</div>
            <div style="font-size:10px;color:var(--faint);margin-top:3px">${s.toCount} of ${s.fromCount}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="ps"><div class="ps-head">Lead Sources</div><div class="ps-body"><div class="donut-wrap">${donutHtml}<div class="donut-legend">${donutLegend||'<div style="color:var(--muted)">No data yet</div>'}</div></div></div></div>

    <div class="ps"><div class="ps-head">Source Performance</div>
      <div class="ps-body" style="padding:0">
        <table><thead><tr><th>Source</th><th>Total</th><th>Won</th><th>Conversion</th><th>Won MRR</th></tr></thead>
        <tbody>${sourceRows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">No data yet</td></tr>'}</tbody></table>
      </div>
    </div>

    <div class="ps"><div class="ps-head" style="color:var(--red)">Lost Reason Breakdown</div><div class="ps-body">${lostRows}</div></div>
  `;
}

}
async function saveDailyTargets(){
  const keys = ['calls','emails','linkedin','followUps','meetings','demos'];

  keys.forEach(k => { dailyTargets[k] = Number(document.getElementById('st-target-'+k).value) || 0; });

  if(d.success){ toast('✓ Targets saved'); }
}

async function openOpportunityDetail(opportunityId){
  const d = await api('getOpportunityDetail', { opportunityId });
  if(!d.success) return;
  const o = d.opportunity, co = d.company, pc = d.primaryContact;
  const panel = document.getElementById('oppPanel');
  panel.innerHTML = `
    <div class="panel-top">
      <div>
        <div style="font-size:11px;color:var(--muted);cursor:pointer" onclick="closeOppPanel();openCompanyPanel('${co.id}')">← ${esc(co.name)}</div>
        <h2 style="margin:6px 0 4px">${esc(o.name || co.name + ' — ' + o.stage)}</h2>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px">
          <span class="badge" style="background:${STAGE_COLORS[o.stage]||OUTCOME_COLORS[o.stage]}22;color:${STAGE_COLORS[o.stage]||OUTCOME_COLORS[o.stage]}">${esc(o.stage)}</span>
          <span class="badge" style="background:${leadScoreColor(d.leadScore)}22;color:${leadScoreColor(d.leadScore)}">🎯 ${d.leadScore}/100</span>
          ${o.estimated_mrr?`<span class="badge" style="background:var(--green-bg);color:var(--green)">₺${Number(o.estimated_mrr).toLocaleString('tr-TR')}/mo</span>`:''}
        </div>
      </div>
      <button class="panel-close" onclick="closeOppPanel()">✕</button>
    </div>

    <div class="ps">
      <div class="ps-head">Deal Info</div>
      <div class="ps-body">
        <div class="fi-row">
          <div class="fi"><label>Plan</label><input id="od-plan" value="${escAttr(o.plan)}"></div>
          <div class="fi"><label>Expected MRR (₺)</label><input id="od-mrr" type="number" value="${o.estimated_mrr||''}"></div>
        </div>
        <div class="fi"><label>Expected Close Date</label><input id="od-close" type="date" value="${o.expected_close_date||''}"></div>
        <div class="fi"><label>Notes</label><textarea id="od-notes" rows="3">${esc(o.notes)}</textarea></div>

    <div class="ps">
      <div class="ps-head">Contact</div>
      <div class="ps-body">
        ${pc?`<div class="contact-row"><div class="avatar" style="${pc.is_decision_maker?'background:var(--amber-bg);color:var(--amber)':''}">${initials(pc.full_name)}</div>
          <div><b>${esc(pc.full_name)}</b> ${pc.is_decision_maker?'<span class="badge" style="background:var(--amber-bg);color:var(--amber)">👑 Decision Maker</span>':''}<br>
          <span style="color:var(--muted);font-size:11px">${esc(pc.email||'')}${pc.phone?' · '+esc(pc.phone):''}${pc.linkedin?' · <a href="'+escAttr(pc.linkedin)+'" target="_blank">LinkedIn</a>':''}</span></div></div>`
          :'<div style="color:var(--muted);font-size:12px">No primary contact set.</div>'}
        ${d.contacts.length>1?`<div class="fi" style="margin-top:10px"><label>Set primary contact</label>
          <select onchange="setPrimaryContact('${o.id}',this.value)">
            <option value="">—</option>
            ${d.contacts.map(c=>`<option value="${c.id}" ${o.primary_contact_id===c.id?'selected':''}>${esc(c.full_name)}</option>`).join('')}
          </select></div>`:''}
      </div>
    </div>

    <div class="ps">
      <div class="ps-head">Next Action</div>
      <div class="ps-body">
        ${d.nextTask?`<div class="mini-item"><b>${esc(d.nextTask.title)}</b> <span style="color:var(--muted)">· ${d.nextTask.due_date||'no date'}</span>
          <span style="cursor:pointer;color:var(--green);font-size:11px;float:right" onclick="completeOppTask('${d.nextTask.id}','${o.id}')">Complete</span></div>`
          :'<div style="color:var(--muted);font-size:12px">No open task. All caught up.</div>'}

          <div class="fi"><input id="od-task-date" type="date"></div>

      <div class="ps-body mini-list">

          <div class="timeline-item"><div>${esc(a.description)}</div><div class="t">${fmtDT(a.created_at)} · ${esc(a.created_by||'')}</div></div>`).join('')}

          ${STAGES.concat(['Lost','No Response','Not a Fit']).map(s=>`<span class="stage-pill" onclick="moveOppFromDetail('${o.id}','${s}','${co.id}')" style="background:${o.stage===s?(STAGE_COLORS[s]||OUTCOME_COLORS[s]||'#666'):'var(--surface-2)'};color:${o.stage===s?'#04170F':'var(--muted)'};border-color:${o.stage===s?'transparent':'var(--border)'}">${s}</span>`).join('')}
        </div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn-add" style="flex:1;background:var(--green)" onclick="moveOppFromDetail('${o.id}','Won','${co.id}')">Mark Won</button>
          <button class="btn-danger" style="flex:1" onclick="moveOppFromDetail('${o.id}','Lost','${co.id}')">Mark Lost</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('oppOverlay').classList.add('open');
}
function closeOppPanel(){ document.getElementById('oppOverlay').classList.remove('open'); }

async function saveOppDetailFields(opportunityId){
  const opportunity = {
    plan: document.getElementById('od-plan').value.trim() || null,
    estimated_mrr: document.getElementById('od-mrr').value || null,
    expected_close_date: document.getElementById('od-close').value || null,
    notes: document.getElementById('od-notes').value.trim() || null,
  };
  const d = await api('updateOpportunity', { opportunityId, opportunity });
  if(d.success){ toast('✓ Saved'); }
}
async function setPrimaryContact(opportunityId, contactId){
  const d = await api('updateOpportunity', { opportunityId, opportunity:{ primary_contact_id: contactId || null } });
  if(d.success){ toast('✓ Primary contact updated'); openOpportunityDetail(opportunityId); }
}
async function completeOppTask(taskId, opportunityId){
  const d = await api('completeTask', { taskId });
  if(d.success){ toast('✓ Task completed'); openOpportunityDetail(opportunityId); }
}
async function addOppTask(opportunityId, companyId){
  const title = document.getElementById('od-task-title').value.trim();
  const due_date = document.getElementById('od-task-date').value || null;
  if(!title){ toast('Task title is required'); return; }
  const d = await api('addTask', { companyId, opportunityId, task:{ title, due_date, task_type:'Follow-up' } });
  if(d.success){ toast('✓ Task added'); openOpportunityDetail(opportunityId); }
}
async function moveOppFromDetail(opportunityId, newStage, companyId){
  let lostReason = null;
  if(newStage === 'Lost'){ lostReason = prompt('Loss reason (optional): Too expensive, No need, No budget, Using another CRM, Bad timing, No response, Not decision maker, Competitor, Other') || ''; }
  const d = await api('updateOpportunityStage', { opportunityId, stage:newStage, lostReason });
  if(d.success){ toast('✓ Stage updated: ' + newStage); openOpportunityDetail(opportunityId); }
}
async function quickAddProposalFromOpp(opportunityId, companyId){
  const d = await api('addProposal', { companyId, opportunityId, proposal:{} });
  if(d.success){ toast('✓ Proposal added — set its value in Company view'); openOpportunityDetail(opportunityId); }
}

async function logQuickActivity(companyId, activityType){
  const d = await api('addActivity', { companyId, activityType });
  if(d.success){
    toast(d.followUpsCreated ? `✓ Logged — ${d.followUpsCreated} follow-up tasks scheduled` : '✓ Activity logged');
    openCompanyPanel(companyId);
  }
}

async function updateCustomerField(companyId, field, value){
  const d = await api('updateCustomer', { companyId, customer:{ [field]: value } });
  if(d.success){ toast('✓ Saved'); }
}

async function saveCompanyProfile(companyId){
  const company = {
    industry: document.getElementById('ec-industry').value.trim(),
    country: document.getElementById('ec-country').value.trim(),
    website: document.getElementById('ec-website').value.trim(),
    company_size: document.getElementById('ec-size').value.trim(),
    instagram: document.getElementById('ec-instagram').value.trim(),
    linkedin: document.getElementById('ec-linkedin').value.trim(),
    current_crm: document.getElementById('ec-crm').value.trim(),
    lead_source: document.getElementById('ec-source').value,
    pain_point: document.getElementById('ec-pain').value.trim(),
    priority: document.getElementById('ec-priority').value,
    research_notes: document.getElementById('ec-notes').value.trim(),
  };

}

let editingOppId = null, editingOppCompanyId = null;

async function quickAddOpportunity(companyId){
  const d = await api('addOpportunity', { companyId, opportunity:{stage:'Prospect'} });
  if(d.success){
    toast('✓ Opportunity added');
    openCompanyPanel(companyId);
    openEditOpportunityModal(d.opportunity.id, companyId);   // hemen tutar/plan girmesi için modal açılıyor
  }
}
async function moveOpportunityStage(opportunityId, newStage, companyId){
  let lostReason = null;
  if(newStage === 'Lost'){ lostReason = prompt('Loss reason (optional): Too expensive, No need, No budget, Using another CRM, Bad timing, No response, Not decision maker, Competitor, Other') || ''; }
  const d = await api('updateOpportunityStage', { opportunityId, stage:newStage, lostReason });
  if(d.success){ toast('✓ Stage updated: ' + newStage); openCompanyPanel(companyId); if(currentPage==='pipeline') renderPipeline(); }
}

async function openEditOpportunityModal(opportunityId, companyId){
  editingOppId = opportunityId; editingOppCompanyId = companyId;
  // Mevcut değerleri panelden değil, taze veriden çekelim (şirket detayını tekrar okuyup ilgili fırsatı bulalım)
  const d = await api('getCompanyDetail', { companyId });
  const opp = d.success ? d.opportunities.find(o => o.id === opportunityId) : null;
  document.getElementById('eo-mrr').value = opp?.estimated_mrr || '';
  document.getElementById('eo-plan').value = opp?.plan || '';
  document.getElementById('eo-close').value = opp?.expected_close_date || '';
  document.getElementById('editOppModal').classList.add('open');
}
function closeEditOppModal(){
  document.getElementById('editOppModal').classList.remove('open');
  editingOppId = null; editingOppCompanyId = null;
}
async function saveOpportunityDetails(){
  if(!editingOppId) return;
  const opportunity = {
    estimated_mrr: document.getElementById('eo-mrr').value || null,
    plan: document.getElementById('eo-plan').value.trim() || null,
    expected_close_date: document.getElementById('eo-close').value || null,
  };
  const d = await api('updateOpportunity', { opportunityId: editingOppId, opportunity });
  if(d.success){
    toast('✓ Deal details saved');
    const cid = editingOppCompanyId;
    closeEditOppModal();
    openCompanyPanel(cid);
    if(currentPage==='pipeline') renderPipeline();
  }
}

function showAddContactForm(companyId){ document.getElementById('addContactForm-'+companyId).classList.remove('hidden'); }
async function submitAddContact(companyId){
  const contact = {
    full_name: document.getElementById('nct-name').value.trim(),
    position: document.getElementById('nct-pos').value.trim(),
    email: document.getElementById('nct-email').value.trim(),
    phone: document.getElementById('nct-phone').value.trim(),
    linkedin: document.getElementById('nct-linkedin').value.trim(),
    is_decision_maker: document.getElementById('nct-decision').checked,
  };
  if(!contact.full_name){ toast('Name is required'); return; }
  const d = await api('addContact', { companyId, contact });
  if(d.success){ toast('✓ Contact added'); openCompanyPanel(companyId); }
}

function showAddTaskForm(companyId){ document.getElementById('addTaskForm-'+companyId).classList.remove('hidden'); }
async function submitAddTask(companyId){
  const task = {
    title: document.getElementById('ntk-title').value.trim(),
    due_date: document.getElementById('ntk-due').value || null,
    task_type: document.getElementById('ntk-type').value,
  };
  if(!task.title){ toast('Task title is required'); return; }
  const d = await api('addTask', { companyId, task });

async function renderPipeline(){
  const d = await api('getOpportunities');
  opportunities = d.opportunities || [];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-head"><div><h1>Pipeline</h1><p>Drag and drop cards to change stage.</p></div></div>
    <div class="board">
      ${STAGES.map(s=>{
        const items = opportunities.filter(o=>o.stage===s);
        return `<div class="col">
          <div class="col-head" style="background:linear-gradient(135deg, ${STAGE_COLORS[s]}, ${STAGE_COLORS[s]}CC)">${s}<span class="count">${items.length}</span></div>
          <div class="col-body" data-stage="${s}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="onDropCard(event,'${s}')">
            ${items.map(o=>`
              <div class="kcard" style="--stat-color:${STAGE_COLORS[s]}" draggable="true" ondragstart="onDragStart(event,'${o.id}')" onclick="openOpportunityDetail('${o.id}')">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
                  <b>${esc(o.companies?.name||'—')}</b>
                  ${o.companies?.priority==='High'?'<span title="High priority">🔥</span>':''}
                </div>
                <div style="color:var(--muted);font-size:10.5px">${esc(o.companies?.industry||'')}${o.companies?.industry&&o.companies?.country?' · ':''}${esc(o.companies?.country||'')}</div>
                ${o.primary_contact_name?`<div style="font-size:10.5px;color:var(--muted);margin-top:4px">👤 ${esc(o.primary_contact_name)}</div>`:''}
                <div class="meta">
                  <span class="mrr">${o.estimated_mrr?'₺'+Number(o.estimated_mrr).toLocaleString('tr-TR'):''}</span>
                  <span style="display:flex;align-items:center;gap:6px">
                    <span style="color:${leadScoreColor(o.lead_score||0)};font-weight:700">🎯${o.lead_score||0}</span>
                    <span>${daysSince(o.stage_changed_at)}d</span>
                  </span>
                </div>
                ${o.next_task?`<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border-subtle);font-size:10px;color:var(--amber)">📅 ${esc(o.next_task.title)}${o.next_task.due_date?' · '+o.next_task.due_date:''}</div>`:''}
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
let draggedOppId = null;
function onDragStart(e, oppId){ draggedOppId = oppId; }
async function onDropCard(e, newStage){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  if(!draggedOppId) return;
  let lostReason = null;
  if(newStage === 'Lost'){ lostReason = prompt('Loss reason (optional):') || ''; }
  const d = await api('updateOpportunityStage', { opportunityId: draggedOppId, stage: newStage, lostReason });
  if(d.success){ toast('✓ ' + newStage + ' stage'); renderPipeline(); }
  draggedOppId = null;
}

// GÖREVLER
// ══════════════════════════════════════════════
async function renderTasks(filter){
  const d = await api('getTasks');
  let tasksAll = d.tasks || [];
  const today = new Date().toISOString().slice(0,10);

  // ── Dashboard kartlarından gelen filtre (örn: sadece Call/Meeting türü, ya da bu hafta) ──
  if(filter?.types){
    const typeList = filter.types.split(',');
    tasksAll = tasksAll.filter(t => typeList.includes(t.task_type));
  }
  if(filter?.when === 'today'){
    tasksAll = tasksAll.filter(t => t.due_date === today);
  } else if(filter?.when === 'week'){
    const dow = (new Date().getDay()+6)%7;
    const monday = new Date(); monday.setDate(monday.getDate()-dow); monday.setHours(0,0,0,0);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const mS = monday.toISOString().slice(0,10), sS = sunday.toISOString().slice(0,10);
    tasksAll = tasksAll.filter(t => t.due_date && t.due_date>=mS && t.due_date<=sS);
  }

  tasks = tasksAll;
  const overdue = tasks.filter(t=>t.due_date && t.due_date < today);
  const todayT = tasks.filter(t=>t.due_date === today);
  const upcoming = tasks.filter(t=>t.due_date && t.due_date > today);
  const noDate = tasks.filter(t=>!t.due_date);

  function section(title, list, color){
    if(list.length===0) return '';
    return `<div class="ps"><div class="ps-head" style="color:${color}">${title} (${list.length})</div>
      <div class="ps-body mini-list">${list.map(t=>`
        <div class="mini-item" style="display:flex;justify-content:space-between;align-items:center">
          <span onclick="openCompanyPanel('${t.company_id}')" style="cursor:pointer"><b>${esc(t.companies?.name||'')}</b> — ${esc(t.title)} ${t.task_type?`<span class="badge" style="background:var(--surface-2);color:var(--muted);margin-left:4px">${esc(t.task_type)}</span>`:''} ${t.due_date?`<span style="color:var(--muted)">· ${t.due_date}</span>`:''}</span>
          <span style="cursor:pointer;color:var(--green);font-size:11px" onclick="event.stopPropagation();completeTaskFromList('${t.id}')">Complete</span>
        </div>`).join('')}</div></div>`;
  }
  const filterBadge = filter ? `<span class="badge" style="background:var(--primary-bg);color:var(--primary);cursor:pointer" onclick="showPage('tasks')">Filtered — click to clear ✕</span>` : '';
  document.getElementById('main').innerHTML = `
    <div class="page-head"><div><h1>Tasks</h1><p>${tasks.length} open tasks ${filterBadge}</p></div></div>
    ${section('🔴 Overdue', overdue, 'var(--red)')}
    ${section('🟡 Today', todayT, 'var(--amber)')}
    ${section('🟢 Upcoming', upcoming, 'var(--green)')}
    ${section('No date', noDate, 'var(--muted)')}
    ${tasks.length===0?'<div class="empty">No tasks match this view.</div>':''}
  `;
}
async function completeTaskFromList(taskId){
  const d = await api('completeTask', { taskId });
  if(d.success){ toast('✓ Completed'); renderTasks(); }
}

// ── Yardımcılar ──
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function fmtDT(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function daysSince(iso){ if(!iso) return 0; return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/86400000)); }
function initials(name){
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  const first = parts[0]?.[0] || '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}
function leadScoreColor(score){
  if(score>=70) return '#39D98A';   // yüksek — yeşil
  if(score>=40) return '#F59E0B';   // orta — amber
  return '#8B949E';                 // düşük — gri
}
